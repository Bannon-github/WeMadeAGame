  <style data-meta="style:slots-page">
    /* ---- Slots Machine Layout ---- */
    .slots-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-xl);
      padding: var(--space-xl) 0;
    }

    /* Machine cabinet */
    .machine {
      background: linear-gradient(180deg, #1a1a3e 0%, #0f0f28 100%);
      border: 3px solid var(--colour-accent);
      border-radius: var(--radius-xl);
      padding: var(--space-xl);
      width: 100%;
      max-width: 540px;
      box-shadow: 0 0 40px rgba(245,197,24,0.25), var(--shadow-lg);
      position: relative;
    }

    /* Top decorative marquee */
    .machine-marquee {
      text-align: center;
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 4vw, 2rem);
      color: var(--colour-accent);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: 0 0 14px var(--colour-accent-glow), 0 0 28px var(--colour-accent-glow);
      margin-bottom: var(--space-lg);
      padding-bottom: var(--space-md);
      border-bottom: 2px solid var(--colour-border);
    }

    /* Reels container */
    .reels-container {
      display: flex;
      gap: var(--space-sm);
      justify-content: center;
      margin-bottom: var(--space-lg);
      background: #080818;
      border: 2px solid var(--colour-border);
      border-radius: var(--radius-md);
      padding: var(--space-sm);
      position: relative;
    }

    /* Payline overlay — center line */
    .reels-container::after {
      content: '';
      position: absolute;
      left: 6px;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      height: 80px;
      border: 2px solid rgba(245,197,24,0.25);
      border-radius: var(--radius-sm);
      pointer-events: none;
      z-index: 10;
    }

    /* Single reel column */
    .reel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      border: 1px solid var(--colour-border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: #0a0a20;
    }

    /* Each symbol cell in a reel */
    .reel-cell {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      border-bottom: 1px solid #1a1a30;
      position: relative;
      transition: background var(--transition-fast);
      user-select: none;
    }
    .reel-cell img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      pointer-events: none;
    }
    .reel-cell:last-child { border-bottom: none; }

    /* Highlight winning cells */
    .reel-cell.winner {
      background: rgba(245,197,24,0.18);
      animation: winFlash 0.5s ease 3;
    }
    @keyframes winFlash {
      0%,100% { background: rgba(245,197,24,0.18); }
      50%      { background: rgba(245,197,24,0.45); }
    }

    /* Spinning animation */
    .reel.spinning .reel-cell {
      animation: spinCell 0.08s linear infinite;
    }
    @keyframes spinCell {
      0%   { transform: translateY(0); opacity: 1; }
      49%  { transform: translateY(40px); opacity: 0.2; }
      50%  { transform: translateY(-40px); opacity: 0.2; }
      100% { transform: translateY(0); opacity: 1; }
    }

    /* ---- Credits & Bet Controls ---- */
    .stats-row {
      display: flex;
      gap: var(--space-md);
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: var(--space-md);
    }

    .stat-box {
      flex: 1;
      min-width: 100px;
      background: #0a0a20;
      border: 1px solid var(--colour-border);
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
      text-align: center;
    }
    .stat-box__label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--colour-text-muted);
      display: block;
      margin-bottom: 2px;
    }
    .stat-box__value {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--colour-accent);
      font-family: var(--font-display);
    }

    /* Bet selector */
    .bet-row {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: var(--space-md);
    }

    .bet-row label {
      font-size: 0.85rem;
      color: var(--colour-text-muted);
      white-space: nowrap;
    }

    .bet-btn {
      background: var(--colour-surface-alt);
      border: 2px solid var(--colour-border);
      border-radius: var(--radius-md);
      color: var(--colour-text);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 4px 14px;
      transition: all var(--transition-fast);
    }
    .bet-btn:hover:not(:disabled) {
      border-color: var(--colour-accent-dim);
      color: var(--colour-accent);
    }
    .bet-btn.active {
      background: var(--colour-accent);
      border-color: var(--colour-accent);
      color: var(--colour-text-inverse);
    }

    /* Spin button */
    .spin-btn {
      width: 100%;
      padding: var(--space-md);
      font-size: 1.2rem;
      border-radius: var(--radius-lg);
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #e8b000 0%, #f5c518 50%, #e8b000 100%);
      color: #000;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 4px 16px rgba(245,197,24,0.4);
      transition: all var(--transition-fast);
      font-family: var(--font-display);
    }
    .spin-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #f5c518 0%, #fff000 50%, #f5c518 100%);
      box-shadow: 0 6px 24px rgba(245,197,24,0.6);
      transform: translateY(-2px);
    }
    .spin-btn:active:not(:disabled) { transform: translateY(0); }
    .spin-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* ---- Message Banner ---- */
    .message-banner {
      width: 100%;
      max-width: 540px;
      text-align: center;
      padding: var(--space-md) var(--space-lg);
      border-radius: var(--radius-md);
      font-size: 1.1rem;
      font-weight: 700;
      font-family: var(--font-display);
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-normal);
      background: var(--colour-surface);
      border: 1px solid var(--colour-border);
      color: var(--colour-text-muted);
    }
    .message-banner.win {
      background: rgba(39,174,96,0.15);
      border-color: var(--colour-success);
      color: var(--colour-success);
      text-shadow: 0 0 8px rgba(39,174,96,0.5);
      animation: messagePop 0.3s ease;
    }
    .message-banner.jackpot {
      background: rgba(245,197,24,0.15);
      border-color: var(--colour-accent);
      color: var(--colour-accent);
      text-shadow: 0 0 14px var(--colour-accent-glow);
      animation: messagePop 0.3s ease, jackpotPulse 0.8s ease 2;
    }
    .message-banner.lose {
      background: rgba(231,76,60,0.1);
      border-color: var(--colour-danger);
      color: var(--colour-danger);
    }
    @keyframes messagePop {
      0% { transform: scale(0.92); opacity: 0.5; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes jackpotPulse {
      0%,100% { box-shadow: 0 0 20px rgba(245,197,24,0.3); }
      50%      { box-shadow: 0 0 40px rgba(245,197,24,0.8); }
    }

    /* ---- Payout Table ---- */
    .payout-section {
      width: 100%;
      max-width: 540px;
    }
    .payout-section h3 {
      text-align: center;
      margin-bottom: var(--space-md);
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .payout-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px;
      font-size: 0.88rem;
    }
    .payout-row {
      display: contents;
    }
    .payout-symbols,
    .payout-value {
      background: var(--colour-surface-alt);
      padding: 6px var(--space-md);
      border-bottom: 1px solid var(--colour-border);
    }
    .payout-symbols { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
    .payout-value   {
      text-align: right;
      color: var(--colour-accent);
      font-weight: 700;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }
    .payout-row.jackpot-row .payout-symbols,
    .payout-row.jackpot-row .payout-value {
      background: rgba(245,197,24,0.12);
      color: var(--colour-accent);
    }

    /* ---- Paylines info ---- */
    .paylines-info {
      font-size: 0.8rem;
      color: var(--colour-text-muted);
      text-align: center;
      margin-top: var(--space-md);
    }

    /* ---- Win counter ---- */
    #win-count-display {
      font-size: 0.8rem;
      color: var(--colour-text-muted);
      text-align: center;
      margin-top: var(--space-sm);
    }
  </style>

  <script src="config.js" data-meta="script:slot-config"></script>
  <script data-meta="script:slots-game">
    /* ============================================================
       slots.js (inline) — Casino Slots game logic
       What:  Core game engine for the slot machine
       Why:   Drives all game state, randomness, payouts, and UI
       How:   Weighted random symbol selection, 5-payline check,
              reel spin animation via CSS class toggling
       When:  Runs when the page loads; reacts to player input
       Where: Embedded in games/casino-slots/index.html
       ============================================================ */

    'use strict';

    // ---- Browser-local configuration ----
    // data-meta="data:symbol-definitions"
    const settings = SlotConfig.getSettings();
    const SYMBOLS = settings.symbols;
    const ROWS = settings.rows;
    const symbolImageUrls = new Map();
    const audioPlayers = new Map();

    // Build cumulative weight pool for weighted random
    // data-meta="data:weight-pool"
    const WEIGHT_POOL = [];
    SYMBOLS.forEach(sym => {
      for (let i = 0; i < sym.weight; i++) WEIGHT_POOL.push(sym);
    });

    // ---- Paylines definition (reel-col indexes per row) ----
    // data-meta="data:paylines"
    // Grid: rows 0-2, reels 0-2 → grid[reel][row]
    const PAYLINES = Array.from({ length: ROWS }, (_, row) => ({
      name: `Row ${row + 1}`,
      cells: [[0, row], [1, row], [2, row]],
    }));
    const middleRow = Math.floor(ROWS / 2);
    PAYLINES.push(
      { name: 'Diagonal down', cells: [[0, 0], [1, middleRow], [2, ROWS - 1]] },
      { name: 'Diagonal up', cells: [[0, ROWS - 1], [1, middleRow], [2, 0]] }
    );

    // ---- Game state ----
    // data-meta="data:game-state"
    const state = {
      credits:   100,
      bet:        5,
      lastWin:    0,
      spinning:  false,
      spinCount:  0,
      winCount:   0,
      grid: Array.from({ length: 3 }, () => Array(ROWS).fill(null)),
    };

    // ---- DOM references ----
    // data-meta="data:dom-refs"
    const creditsDisplay = document.getElementById('credits-display');
    const betDisplay     = document.getElementById('bet-display');
    const lastWinDisplay = document.getElementById('last-win-display');
    const spinBtn        = document.getElementById('spin-btn');
    const msgBanner      = document.getElementById('message-banner');
    const spinCountEl    = document.getElementById('spin-count');
    const winCountEl     = document.getElementById('win-count');
    const reelsContainer = document.querySelector('.reels-container');
    const payoutGrid      = document.getElementById('payout-grid');

    function buildReels() {
      reelsContainer.replaceChildren();
      for (let reelIndex = 0; reelIndex < 3; reelIndex++) {
        const reel = document.createElement('div');
        reel.className = 'reel';
        reel.id = `reel-${reelIndex}`;
        reel.dataset.meta = `widget:reel-${reelIndex + 1}`;
        reel.setAttribute('aria-label', `Reel ${reelIndex + 1}`);
        for (let row = 0; row < ROWS; row++) {
          const cell = document.createElement('div');
          cell.className = 'reel-cell';
          cell.id = `r${reelIndex}c${row}`;
          cell.dataset.meta = `cell:r${reelIndex}c${row}`;
          cell.setAttribute('aria-hidden', 'true');
          reel.appendChild(cell);
        }
        reelsContainer.appendChild(reel);
      }
      document.getElementById('payline-count').textContent = PAYLINES.length;
    }

    function renderSymbol(element, symbol) {
      element.replaceChildren();
      const imageUrl = symbolImageUrls.get(symbol.id);
      if (imageUrl) {
        const image = document.createElement('img');
        image.src = imageUrl;
        image.alt = '';
        image.dataset.meta = `media:symbol-${symbol.id}`;
        element.appendChild(image);
      } else {
        element.textContent = symbol.emoji;
      }
      element.setAttribute('aria-label', symbol.label);
    }

    function buildPayoutTable() {
      payoutGrid.replaceChildren();
      [...SYMBOLS].reverse().forEach(symbol => {
        const row = document.createElement('div');
        row.className = `payout-row${symbol.id === 'seven' ? ' jackpot-row' : ''}`;
        row.setAttribute('role', 'row');
        row.dataset.meta = `payout-row:${symbol.id}`;

        const symbolsCell = document.createElement('div');
        symbolsCell.className = 'payout-symbols';
        symbolsCell.setAttribute('role', 'cell');
        symbolsCell.dataset.meta = `cell:${symbol.id}-symbols`;
        symbolsCell.textContent = `${symbol.emoji} ${symbol.emoji} ${symbol.emoji}${symbol.id === 'seven' ? '  JACKPOT' : ''}`;

        const valueCell = document.createElement('div');
        valueCell.className = 'payout-value';
        valueCell.setAttribute('role', 'cell');
        valueCell.dataset.meta = `cell:${symbol.id}-value`;
        valueCell.textContent = `× ${symbol.mult}`;
        row.append(symbolsCell, valueCell);
        payoutGrid.appendChild(row);
      });

      const cherryRow = document.createElement('div');
      cherryRow.className = 'payout-row';
      cherryRow.setAttribute('role', 'row');
      cherryRow.dataset.meta = 'payout-row:cherry-any';
      cherryRow.innerHTML = `
        <div class="payout-symbols" role="cell" data-meta="cell:cherry-any-symbols">🍒 🍒 (any)</div>
        <div class="payout-value" role="cell" data-meta="cell:cherry-any-value">× 2</div>`;
      payoutGrid.appendChild(cherryRow);
    }

    async function loadCustomMedia() {
      await Promise.all(SYMBOLS.map(async symbol => {
        const blob = await SlotConfig.getMedia(`image:${symbol.id}`);
        if (blob) symbolImageUrls.set(symbol.id, URL.createObjectURL(blob));
      }));
      await Promise.all(SlotConfig.audioEvents.map(async event => {
        const blob = await SlotConfig.getMedia(`audio:${event.id}`);
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        audio.preload = 'auto';
        audioPlayers.set(event.id, audio);
      }));
    }

    function playSound(eventId) {
      const audio = audioPlayers.get(eventId);
      if (!audio) return;
      audio.currentTime = 0;
      audio.play().catch(error => console.warn(`Casino Slots "${eventId}" audio could not play.`, error));
    }

    // ---- Weighted random symbol picker ----
    // data-meta="function:pick-random-symbol"
    function pickSymbol() {
      return WEIGHT_POOL[Math.floor(Math.random() * WEIGHT_POOL.length)];
    }

    // ---- Update all UI displays ----
    // data-meta="function:update-ui"
    function updateUI() {
      creditsDisplay.textContent = state.credits;
      betDisplay.textContent     = state.bet;
      lastWinDisplay.textContent = state.lastWin;
      spinCountEl.textContent    = state.spinCount;
      winCountEl.textContent     = state.winCount;
      spinBtn.disabled = state.spinning || state.credits < state.bet;
    }

    // ---- Set message banner ----
    // data-meta="function:set-message"
    function setMessage(text, type = '') {
      msgBanner.textContent = text;
      msgBanner.className   = 'message-banner ' + type;
    }

    // ---- Highlight winning cells ----
    // data-meta="function:highlight-winners"
    function highlightWinners(winningCells) {
      // Clear previous highlights
      document.querySelectorAll('.reel-cell').forEach(el => el.classList.remove('winner'));
      // Apply winner class
      winningCells.forEach(([r, c]) => {
        const el = document.getElementById(`r${r}c${c}`);
        if (el) el.classList.add('winner');
      });
    }

    // ---- Evaluate all paylines ----
    // data-meta="function:evaluate-paylines"
    function evaluatePaylines(grid) {
      let totalPayout = 0;
      const allWinningCells = [];
      const wins = [];

      PAYLINES.forEach(line => {
        const [s0, s1, s2] = line.cells.map(([r, c]) => grid[r][c]);

        let payout = 0;
        let winDesc = '';

        if (s0.id === s1.id && s1.id === s2.id) {
          // Triple match
          payout = state.bet * s0.mult;
          winDesc = `${s0.label} ×3 — ${line.name}`;
          line.cells.forEach(cell => allWinningCells.push(cell));
        } else if (s0.id === 'cherry' && s1.id === 'cherry') {
          // Two cherries on left (any third)
          payout = state.bet * 2;
          winDesc = `Cherry ×2 — ${line.name}`;
          allWinningCells.push(line.cells[0], line.cells[1]);
        }

        if (payout > 0) {
          totalPayout += payout;
          wins.push({ desc: winDesc, payout, symbolId: s0.id });
        }
      });

      return { totalPayout, allWinningCells, wins };
    }

    // ---- Render grid to DOM cells ----
    // data-meta="function:render-grid"
    function renderGrid() {
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < ROWS; c++) {
          const el = document.getElementById(`r${r}c${c}`);
          if (el && state.grid[r][c]) renderSymbol(el, state.grid[r][c]);
        }
      }
    }

    // ---- Spin one reel (with delay) ----
    // data-meta="function:spin-reel"
    function spinReel(reelIndex, delay) {
      return new Promise(resolve => {
        const reelEl = document.getElementById(`reel-${reelIndex}`);

        // Fast shuffle symbols during spin animation
        reelEl.classList.add('spinning');
        let shuffleInterval = setInterval(() => {
          for (let c = 0; c < ROWS; c++) {
            const el = document.getElementById(`r${reelIndex}c${c}`);
            if (el) renderSymbol(el, pickSymbol());
          }
        }, 80);

        setTimeout(() => {
          clearInterval(shuffleInterval);
          reelEl.classList.remove('spinning');
          playSound('reel-stop');

          // Set final result
          for (let c = 0; c < ROWS; c++) {
            state.grid[reelIndex][c] = pickSymbol();
          }
          renderGrid();
          resolve();
        }, delay);
      });
    }

    // ---- Main spin handler ----
    // data-meta="function:do-spin"
    async function doSpin() {
      if (state.spinning || state.credits < state.bet) return;

      // Deduct bet
      state.spinning  = true;
      state.credits  -= state.bet;
      state.lastWin   = 0;
      state.spinCount++;
      playSound('spin');

      // Clear previous win highlights
      highlightWinners([]);
      setMessage('Spinning…', '');
      updateUI();

      // Spin reels sequentially (left → middle → right)
      await spinReel(0, 900);
      await spinReel(1, 1200);
      await spinReel(2, 1500);

      // Evaluate result
      const { totalPayout, allWinningCells, wins } = evaluatePaylines(state.grid);

      state.spinning = false;

      if (totalPayout > 0) {
        state.credits  += totalPayout;
        state.lastWin   = totalPayout;
        state.winCount++;
        highlightWinners(allWinningCells);

        const isJackpot = wins.some(w => w.symbolId === 'seven');
        const winLines  = wins.map(w => `${w.desc} (+${w.payout})`).join(' | ');

        if (isJackpot) {
          playSound('jackpot');
          setMessage(`🎰 JACKPOT! +${totalPayout} credits! 🎰`, 'jackpot');
        } else {
          playSound('win');
          setMessage(`🎉 You won ${totalPayout} credits! ${winLines}`, 'win');
        }
      } else {
        playSound('loss');
        setMessage('No win this time — try again!', 'lose');
      }

      // Auto-reset credits if busted
      if (state.credits === 0) {
        setTimeout(() => {
          state.credits = 100;
          playSound('reload');
          setMessage('No credits left — reloaded to 100! 🪙', '');
          updateUI();
        }, 2000);
      }

      updateUI();
    }

    // ---- Bet buttons ----
    // data-meta="function:init-bet-buttons"
    document.querySelectorAll('.bet-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (state.spinning) return;
        state.bet = parseInt(btn.dataset.bet, 10);
        playSound('bet');
        document.querySelectorAll('.bet-btn').forEach(b => {
          b.classList.toggle('active', b === btn);
          b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
        });
        updateUI();
      });
    });

    // ---- Spin button ----
    // data-meta="function:init-spin-button"
    spinBtn.addEventListener('click', doSpin);

    // ---- Space/Enter keyboard shortcut ----
    // data-meta="function:keyboard-handler"
    document.addEventListener('keydown', e => {
      if ((e.code === 'Space' || e.code === 'Enter') && e.target === document.body && !state.spinning) {
        e.preventDefault();
        doSpin();
      }
    });

    // ---- Initial render ----
    // data-meta="function:init"
    async function init() {
      buildReels();
      buildPayoutTable();
      await loadCustomMedia();
      for (let reel = 0; reel < 3; reel++) {
        for (let row = 0; row < ROWS; row++) state.grid[reel][row] = pickSymbol();
      }
      renderGrid();
      updateUI();
    }

    init().catch(error => {
      console.error('Casino Slots could not initialize.', error);
      setMessage('The game could not load its saved media. Try resetting it in Edit Game.', 'lose');
    });

    window.addEventListener('beforeunload', () => {
      symbolImageUrls.forEach(url => URL.revokeObjectURL(url));
      audioPlayers.forEach(audio => URL.revokeObjectURL(audio.src));
    });
  </script>

</body>
</html>
