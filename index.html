<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="WeMadeAGame — an AI-driven game laboratory. Enter the Game Lab." />
  <meta name="robots" content="index, follow" />
  <!-- Root entry point for GitHub Pages (served from the repository root).
       The canonical site lives under /games/. This page redirects there so the
       base URL (https://bannon-github.github.io/WeMadeAGame/) lands on the hub. -->
  <meta http-equiv="refresh" content="0; url=games/index.html" />
  <link rel="canonical" href="games/index.html" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%8E%B0%3C/text%3E%3C/svg%3E" />
  <title>WeMadeAGame — Game Lab</title>
  <style>
    :root { --gold: #f5c518; --bg: #0a0e1a; --ink: #e8ecf5; --muted: #9aa3b8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(1100px 650px at 50% -10%, #1c2440 0%, #0a0e1a 60%);
      color: var(--ink); font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      display: grid; place-items: center; text-align: center; padding: 24px;
    }
    .card {
      max-width: 520px; background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.12); border-radius: 18px; padding: 40px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .logo { font-size: 54px; line-height: 1; }
    h1 { margin: 14px 0 6px; font-size: 30px; color: var(--gold); letter-spacing: .5px; }
    p { margin: 8px 0 22px; color: var(--muted); }
    a.enter {
      display: inline-block; text-decoration: none; font-weight: 700;
      color: #1a1300; background: var(--gold); padding: 12px 26px; border-radius: 12px;
      transition: filter .15s ease;
    }
    a.enter:hover { filter: brightness(1.08); }
    .dots::after { content: "…"; animation: e 1.2s steps(4) infinite; }
    @keyframes e { 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"…"} }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🎰</div>
    <h1>WeMadeAGame</h1>
    <p>Entering the Game Lab<span class="dots"></span></p>
    <a class="enter" href="games/index.html">Enter the Game Lab →</a>
  </div>
  <script>
    // Belt-and-suspenders redirect in case the meta refresh is blocked.
    setTimeout(function () { location.replace("games/index.html"); }, 350);
  </script>
</body>
</html>
